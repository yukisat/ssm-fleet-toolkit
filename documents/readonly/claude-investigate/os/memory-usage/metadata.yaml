name: claude-investigate-os-memory-usage
category: os
subcategory: linux-common
safety: readonly
description: |
  メモリ使用量とスワップ使用量を JSON で取得する。
  /proc/meminfo から MemTotal / MemAvailable / Buffers / Cached / SwapTotal / SwapFree を集計。

supported_os:
  - amazon-linux-2
  - amazon-linux-2023
  - ubuntu-20.04
  - ubuntu-22.04
  - ubuntu-24.04
  - rhel-9
  - debian-12

required_packages: []
required_commands:
  - awk

parameters: []

output_schema:
  type: object
  properties:
    total_bytes: { type: integer }
    available_bytes: { type: integer }
    used_bytes: { type: integer }
    use_percent: { type: number }
    buffers_bytes: { type: integer }
    cached_bytes: { type: integer }
    swap_total_bytes: { type: integer }
    swap_used_bytes: { type: integer }
    swap_use_percent: { type: number }

estimated_runtime_seconds: 1

claude_hints: |
  - use_percent は MemAvailable ベースで計算。Buffers / Cached を除いた実質使用率
  - swap_use_percent > 50 はスワップ多発、性能劣化の可能性
  - swap_total_bytes = 0 は swap 未設定。OOM 時に即落ちる可能性
  - available_bytes が極端に小さい場合、OOM Killer 発火の前兆
