schemaVersion: "2.2"
description: |
  ロードアベレージと CPU コア数を JSON で取得する readonly 調査 Document。
parameters: {}
mainSteps:
  - action: aws:runShellScript
    name: collectLoadAverage
    inputs:
      timeoutSeconds: "10"
      runCommand:
        - |
          set -eu
          read -r load1 load5 load15 _ < /proc/loadavg
          cores=$(nproc)
          read -r per1 per5 <<<"$(awk -v l1="$load1" -v l5="$load5" -v c="$cores" \
            'BEGIN { if (c>0) printf "%.2f %.2f\n", l1/c, l5/c; else print "null null" }')"
          printf '{"load_1min":%.2f,"load_5min":%.2f,"load_15min":%.2f,"cores":%d,"load_per_core_1min":%s,"load_per_core_5min":%s}\n' \
            "$load1" "$load5" "$load15" "$cores" "$per1" "$per5"
