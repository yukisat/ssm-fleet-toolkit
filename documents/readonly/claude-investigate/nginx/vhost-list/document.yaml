schemaVersion: "2.2"
description: |
  nginx の vhost (server) ブロック一覧と server_name / root を JSON で取得する readonly Document。
parameters:
  ConfigDir:
    type: String
    description: nginx 設定ディレクトリ。空なら自動探索
    default: ""
mainSteps:
  - action: aws:runShellScript
    name: listVhosts
    inputs:
      timeoutSeconds: "20"
      runCommand:
        - |
          set -eu
          CONFIG_DIR="{{ ConfigDir }}"
          if [ -z "$CONFIG_DIR" ]; then
            for candidate in /etc/nginx/conf.d /etc/nginx/sites-enabled /etc/nginx/vhosts.d; do
              if [ -d "$candidate" ]; then CONFIG_DIR="$candidate"; break; fi
            done
          fi
          if [ -z "$CONFIG_DIR" ] || [ ! -d "$CONFIG_DIR" ]; then
            echo "nginx 設定ディレクトリが見つかりません" >&2
            exit 1
          fi
          python3 <<PYEOF
          import json
          import os
          import re

          confdir = "$CONFIG_DIR"
          results = []
          for fname in sorted(os.listdir(confdir)):
              path = os.path.join(confdir, fname)
              if not os.path.isfile(path) or not fname.endswith('.conf'):
                  continue
              try:
                  with open(path) as f:
                      content = f.read()
              except (OSError, UnicodeDecodeError):
                  continue
              for m in re.finditer(r'server\s*\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}', content, re.DOTALL):
                  block = m.group(1)
                  names = re.findall(r'\bserver_name\s+([^;]+);', block)
                  roots = re.findall(r'\broot\s+([^;]+);', block)
                  listens = re.findall(r'\blisten\s+([^;]+);', block)
                  results.append({
                      "file": fname,
                      "server_names": [n.strip() for sublist in names for n in sublist.split()],
                      "roots": [r.strip() for r in roots],
                      "listens": [l.strip() for l in listens],
                  })
          print(json.dumps(results, ensure_ascii=False))
          PYEOF
