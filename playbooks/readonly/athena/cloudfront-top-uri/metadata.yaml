name: athena-cloudfront-top-uri
category: athena
subcategory: cloudfront
safety: readonly
description: |
  CloudFront アクセスログから期間内のリクエスト数 Top URI を集計する。
  異常なアクセス集中の調査に利用。Glue データカタログに CloudFront ログテーブル
  が登録済みであることが前提。

required_permissions:
  - athena:StartQueryExecution
  - athena:GetQueryExecution
  - athena:GetQueryResults
  - athena:StopQueryExecution
  - athena:CreateWorkGroup  # 専用 WorkGroup が無い場合に作成（ssm-fleet-investigator に限定）
  - glue:GetTable
  - glue:GetDatabase
  - glue:GetPartitions
  - s3:GetObject
  - s3:PutObject
  - s3:ListBucket
  - s3:CreateBucket  # 結果バケットが無い場合に作成（ssm-fleet-athena-results-* に限定）

required_resources:
  athena_workgroup: ssm-fleet-investigator  # 専用 WorkGroup（コスト上限付き）。primary は使わない
  athena_results_bucket: "ssm-fleet-athena-results-<account>-<region>"  # 専用名。無ければ調査ロールが作成
  glue_database: cloudfront_logs  # 利用者環境に合わせて変更
  glue_table: cf_access_log

cost_controls:
  workgroup:
    name: ssm-fleet-investigator
    bytes_scanned_cutoff_per_query: 10737418240  # 10 GiB
    enforce_workgroup_configuration: true
    result_encryption: SSE_S3
    publish_cloudwatch_metrics: true
  partition_pruning_required: true  # WHERE 句で year/month/day/hour 必須
  dry_run_recommended: true          # 短期間で実績取得 → 本番外挿
  pricing_basis: "$5 per TB scanned (2026-05 時点)"

parameters:
  - name: distribution_id
    type: string
    required: true
    description: "CloudFront ディストリビューション ID（例 E1XXXXXXXXXXXX）"
  - name: time_from
    type: timestamp
    required: true
    description: 集計開始時刻 (UTC, ISO 8601)
  - name: time_to
    type: timestamp
    required: true
    description: 集計終了時刻 (UTC, ISO 8601)
  - name: top_n
    type: integer
    default: 50

output_schema:
  type: array
  items:
    type: object
    properties:
      uri: { type: string }
      request_count: { type: integer }
      avg_bytes: { type: number }
      total_bytes: { type: integer }
      distinct_clients: { type: integer }

estimated_runtime_seconds: 30
estimated_cost_usd: 0.01  # Athena スキャン料金の目安、データ量で増減

claude_hints: |
  - 【最重要】Athena・結果バケット・WorkGroup は CF ログ出力先 S3 バケットと同じリージョンで実行する。
    Athena は同一リージョンの S3 しか参照できない。実行前に必ずログ出力先バケットのリージョンを確認すること
    （aws cloudfront get-distribution-config の Logging.Bucket → aws s3api get-bucket-location）。
    権限上の許可リージョンは ap-northeast-1 / us-west-2。
  - 上位 URI が一つだけ突出していたら DDoS や bot 巡回を疑う
  - distinct_clients が極端に少ない（数 IP）なら特定ソースからの攻撃の可能性
  - 404 が上位の場合は設定ミスや欠損コンテンツを疑う
  - 結果は数千行になる場合あり、top_n でフィルタすること
  - 期間を短くしてからスキャン量を抑えるのがコスト対策
