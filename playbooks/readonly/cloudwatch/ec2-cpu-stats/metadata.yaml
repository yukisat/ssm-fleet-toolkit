name: cloudwatch-ec2-cpu-stats
category: cloudwatch
subcategory: ec2
safety: readonly
description: EC2 インスタンスの CPUUtilization メトリクスを時系列で取得する。
required_permissions:
  - cloudwatch:GetMetricStatistics
  - cloudwatch:GetMetricData
parameters:
  - name: instance_id
    type: string
    required: true
  - name: time_from
    type: timestamp
    required: true
  - name: time_to
    type: timestamp
    required: true
  - name: period_seconds
    type: integer
    default: 300
output_schema:
  type: array
  items:
    type: object
    properties:
      timestamp: { type: string }
      average: { type: number }
      maximum: { type: number }
estimated_runtime_seconds: 5
estimated_cost_usd: 0.00
claude_hints: |
  - average > 70% が継続 → スケールアップ検討
  - maximum で短時間スパイク確認、平均だけだと見逃す
  - period_seconds=60 は最大 3 時間まで、それ以上は 300 推奨
  - 同時刻のメモリ・ディスク I/O も合わせて確認
